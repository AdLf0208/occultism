[mod]
id = "occultism"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure spirit-fire rules (standalone crate lib, injected as
# `crate::game::occultism`): the recipe table, the lighter and chalk tables and
# the two pieces of click geometry.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "occultism"
source = "runtime.rs"

# Game-side glue: the recipe read (API 36), the item-entity tick, the click, the
# readouts and the conversion counters.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "occultism_state"
source = "support.rs"

# The content half is inside this bundle (`data/occultism-content.hmod`, the built
# `content/occultism.hmod`): this writes it to `.horizon-cache/` and appends it to
# the dev-mod list, so one `.hnmod` installs the block, the items and the code.
# The registry keeps one file per project, so a split port could not be listed;
# AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# A right click with an item on a block: chalk paints the fire, a lighter
# strikes the datura lying on it (API 13, upstream's `useItemOn` and
# `PlayerInteractEvent.RightClickBlock`).
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# The bundle hears entity ticks (API 146); without this answer none is told.
[[injection]]
id = "entity-tick-listened"
hook = "entity_tick_listened"
hook_version = 1
kind = "HEAD"
helper = "entity_tick_listened.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "listened", ty = "&mut bool", value = "listened" },
]

# An item entity's tick ended: convert it when it stands in spirit fire
# (API 146, upstream's `entityInside`).
[[injection]]
id = "entity-tick-post"
hook = "entity_tick_post"
hook_version = 1
kind = "HEAD"
helper = "entity_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
]

# `/occultism info|recipes` (API 8).
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
