id = "occultism"
name = "Occultism"
version = "0.2.11"
description = """A port of Occultism 1.225.0 for Horizon: the spirit-fire conversion loop and the datura it
is lit with. A datura (Demon's Dream Fruit) struck with flint and steel or a fire charge lights
occultism:spirit_fire; any item entity standing in that fire which one of the carried
occultism:spirit_fire recipes accepts becomes the recipe's result with the input's own count (3 feathers
become 3 awakened feathers); a chalk right-clicked on the fire recolours it (16 chalks, the gold chalk is
yellow); /occultism info <pos> (operator only, level 2) and /occultism recipes read the fire, its most
recent conversion and the loaded recipe table back (the recent conversion ring is bounded to 256 and
scoped to the world, dimension and position). A spectator's click changes nothing and consumes no datura.
The datura crop grows from occultism:datura_seeds on farmland by random tick (the wheat template, ages
0-7), is harvested by right-click at its last age (the loot table's fruit and seeds, replanted at age 0),
and breaks by hand into its loot table; breaking short or tall grass without shears has the jar's 2%
chance of a seed. The package carries 46 blocks (with their item forms), 44 carried item declarations,
45 loot tables (the crop's, the four carried blocks', the six stone building blocks', the twelve
bricks-tier ones', the eight polished-tier ones', the eight cobblestone-tier ones' and the four redstone ones'), 27
spirit-fire recipes, 38 crafting-table recipes, 6 smelting recipes, 15 tags and the models, textures and lang they
need. The crafting
recipes are the ones whose result and every ingredient the package already provides: a 3x3 grid of
the datura fruit or the datura seed (the #c:crops/datura / #c:seeds/datura alternative) makes one
Demon's Dream Essence, the shapeless awakened feather + purified ink + taboo book makes the Book of
Binding, the six otherstone/otherrock building recipes make their slabs, stairs and walls (three
stones in the middle row make six slabs, the stair step four stairs, two rows six walls), the bricks
tier builds on those stones (a 2x2 of the stone makes four bricks, the brick slab/stair/wall recipes
work from the bricks, two brick slabs stacked make the chiseled block, and a furnace turns the
bricks into the cracked pair at 200 ticks), the polished tier is smelted from the raw stone
(otherstone or otherrock + coal in a furnace, 200 ticks, 0.5 experience) and then shaped into its
slabs, stairs and walls, the cobblestone tier is mined from the raw stones (a break without silk
touch drops othercobblestone or othercobblerock, silk touch keeps the stone) and shaped into its
slabs, stairs and walls, the redstone pair is one stone -> one button and two stones in a row ->
one pressure plate, each plate reading powered under the player and each button staying pressed for
its template's press duration, and the frames and pedestals are the tier's ornamental half: eight
stones in a ring make one otherstone or otherrock frame (an item, used by rituals), and five slabs
plus one stone make a pedestal (the otherrock one keeps the jar's old id
occultism:otherstone_pedestal_silver) whose post-shaped, non-occluding block drops only to a
pickaxe; a cobble block also smelts back into the stone. The pentacle rituals,
the summoned spirits and their AI, the GeckoLib models, the Otherworld dimension, the guide book, Curios
slots and the spirit-job recipes are not ported yet."""
authors = ["klikli-dev", "AdLf0208"]
# The original's licence: MIT (klikli-dev/Occultism, tag release/v1.21.1-1.225.0); its text and
# copyright notice travel inside the package as LICENSE / LICENSE-NOTICE.md.
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# The installation side, not the hook's: the conversion and the readouts run on the server, and
# single player's integrated server belongs to the client installation, so "both".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"): the package declares the spirit-fire block, the datura crop, the thirty
# otherstone/otherrock building blocks, the four redstone ones and their items, and a creative tab.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
